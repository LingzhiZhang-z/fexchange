[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fexchange"
version = "0.1.0"
description = "Fock-basis operators and second-order perturbation (SOPT) pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
]

[project.optional-dependencies]
test = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
]

[project.scripts]
fexchange-singlesite = "fexchange.utils.cli_singlesite:main"
fexchange-sopt = "fexchange.utils.cli_sopt:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fexchange*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["fexchange"]
omit = ["*/tests/*"]
