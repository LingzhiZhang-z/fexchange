[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fexchange"
version = "0.1.0"
description = "Reference implementation for f-electron exchange standards"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "sympy>=1.12",
]

[project.optional-dependencies]
mpi = ["mpi4py>=3.1"]
dev = ["pytest>=7.0"]

[project.scripts]
fexchange = "fexchange.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["fexchange*"]
exclude = ["docs*"]
